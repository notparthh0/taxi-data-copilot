# Blind question set (15 questions, 5 per difficulty level). NOT part of the frozen 150.
# Written WITHOUT access to the cleaning rules, the metric list, the semantic layer or the
# existing 150 questions: a fresh model instance saw only the cleaned table schema and the
# question format. author says so. It is not a classmate; see docs/PLAN.md.
# gold = SQL on the cleaned tables (the gold answer); raw = the obvious SQL on the raw table
# (the naive raw answer, written by the author, using the same conventions as the main set:
# TLC integer payment codes, 1 = credit card and 2 = cash; boroughs via taxi_zone_lookup).
- {id: b001, d: 1, cat: count, author: claude-fresh-context, written_blind: true,
   q: "How many yellow taxi trips in 2023 started in Manhattan?",
   gold: "SELECT count(*) AS trip_count FROM fct_trips WHERE pickup_borough = 'Manhattan'",
   raw: "SELECT count(*) FROM yellow_tripdata y JOIN taxi_zone_lookup z ON y.PULocationID = z.LocationID WHERE z.Borough = 'Manhattan'"}
- {id: b002, d: 1, cat: count, author: claude-fresh-context, written_blind: true,
   q: "How many 2023 trips were paid by credit card?",
   gold: "SELECT count(*) AS trip_count FROM fct_trips WHERE payment_type = 'Credit card'",
   raw: "SELECT count(*) FROM yellow_tripdata WHERE payment_type = 1"}
- {id: b003, d: 1, cat: average, author: claude-fresh-context, written_blind: true,
   q: "What was the average tip, in US dollars, on 2023 trips paid by credit card?",
   gold: "SELECT round(avg(tip_amount), 2) AS avg_tip_usd FROM fct_trips WHERE payment_type = 'Credit card'",
   raw: "SELECT round(avg(tip_amount), 2) FROM yellow_tripdata WHERE payment_type = 1"}
- {id: b004, d: 1, cat: revenue, author: claude-fresh-context, written_blind: true,
   q: "What was the total toll amount, in US dollars, charged across all trips in March 2023?",
   gold: "SELECT round(sum(tolls_amount), 2) AS total_tolls_usd FROM fct_trips WHERE month_key = '2023-03'",
   raw: "SELECT round(sum(tolls_amount), 2) FROM yellow_tripdata WHERE extract(year FROM tpep_pickup_datetime) = 2023 AND extract(month FROM tpep_pickup_datetime) = 3"}
- {id: b005, d: 1, cat: count, author: claude-fresh-context, written_blind: true,
   q: "How many trips in 2023 were longer than 10 miles?",
   gold: "SELECT count(*) AS long_trip_count FROM fct_trips WHERE trip_distance_miles > 10",
   raw: "SELECT count(*) FROM yellow_tripdata WHERE trip_distance > 10 AND extract(year FROM tpep_pickup_datetime) = 2023"}
- {id: b006, d: 2, cat: group, author: claude-fresh-context, written_blind: true,
   q: "How many trips in 2023 started in each pickup borough, listed from most to fewest trips?",
   gold: "SELECT pickup_borough, count(*) AS trip_count FROM fct_trips GROUP BY pickup_borough ORDER BY trip_count DESC",
   raw: "SELECT z.Borough, count(*) AS trip_count FROM yellow_tripdata y JOIN taxi_zone_lookup z ON y.PULocationID = z.LocationID GROUP BY z.Borough ORDER BY trip_count DESC"}
- {id: b007, d: 2, cat: time, author: claude-fresh-context, written_blind: true,
   q: "What was the average fare_amount, in US dollars, for 2023 trips in each pickup hour of the day (0 to 23)?",
   gold: "SELECT pickup_hour, round(avg(fare_amount), 2) AS avg_fare_usd FROM fct_trips GROUP BY pickup_hour ORDER BY pickup_hour",
   raw: "SELECT extract(hour FROM tpep_pickup_datetime) AS pickup_hour, round(avg(fare_amount), 2) AS avg_fare_usd FROM yellow_tripdata GROUP BY pickup_hour ORDER BY pickup_hour"}
- {id: b008, d: 2, cat: ranking, author: claude-fresh-context, written_blind: true,
   q: "Which 5 pickup zones had the most trips in 2023, and how many trips did each have?",
   gold: "SELECT pickup_zone, count(*) AS trip_count FROM fct_trips GROUP BY pickup_zone ORDER BY trip_count DESC LIMIT 5",
   raw: "SELECT z.Zone, count(*) AS trip_count FROM yellow_tripdata y JOIN taxi_zone_lookup z ON y.PULocationID = z.LocationID GROUP BY z.Zone ORDER BY trip_count DESC LIMIT 5"}
- {id: b009, d: 2, cat: group, author: claude-fresh-context, written_blind: true,
   q: "For 2023 trips, how much total_amount, in US dollars, was charged in each pickup borough, highest first?",
   gold: "SELECT z.borough AS zone_borough, round(sum(f.total_amount), 2) AS total_amount_usd FROM fct_trips f JOIN dim_zones z ON f.pickup_zone_id = z.zone_id GROUP BY z.borough ORDER BY total_amount_usd DESC",
   raw: "SELECT z.Borough, round(sum(y.total_amount), 2) AS total_amount_usd FROM yellow_tripdata y JOIN taxi_zone_lookup z ON y.PULocationID = z.LocationID GROUP BY z.Borough ORDER BY total_amount_usd DESC"}
- {id: b010, d: 2, cat: time, author: claude-fresh-context, written_blind: true,
   q: "How many trips in 2023 started on a weekend (Saturday or Sunday) in each month?",
   gold: "SELECT month_key, count(*) AS weekend_trip_count FROM fct_trips WHERE is_weekend GROUP BY month_key ORDER BY month_key",
   raw: "SELECT strftime(tpep_pickup_datetime, '%Y-%m') AS month_key, count(*) AS weekend_trip_count FROM yellow_tripdata WHERE dayofweek(tpep_pickup_datetime) IN (0, 6) GROUP BY month_key ORDER BY month_key"}
- {id: b011, d: 3, cat: share, author: claude-fresh-context, written_blind: true, percent: true,
   q: "What percentage of all 2023 trips were paid in cash?",
   gold: "SELECT round(100.0 * sum(CASE WHEN payment_type = 'Cash' THEN 1 ELSE 0 END) / count(*), 2) AS cash_share_pct FROM fct_trips",
   raw: "SELECT round(100.0 * sum(CASE WHEN payment_type = 2 THEN 1 ELSE 0 END) / count(*), 2) FROM yellow_tripdata"}
- {id: b012, d: 3, cat: compare, author: claude-fresh-context, written_blind: true,
   q: "What was the average trip_distance_miles in 2023 for weekend trips compared with weekday trips, in miles?",
   gold: "SELECT is_weekend, round(avg(trip_distance_miles), 2) AS avg_distance_miles FROM fct_trips GROUP BY is_weekend ORDER BY is_weekend",
   raw: "SELECT dayofweek(tpep_pickup_datetime) IN (0, 6) AS is_weekend, round(avg(trip_distance), 2) AS avg_distance_miles FROM yellow_tripdata GROUP BY is_weekend ORDER BY is_weekend"}
- {id: b013, d: 3, cat: top_per_group, author: claude-fresh-context, written_blind: true,
   q: "For each pickup borough, which single pickup zone had the most trips in 2023, and how many trips did it have?",
   gold: "WITH zone_counts AS (SELECT pickup_borough, pickup_zone, count(*) AS trip_count FROM fct_trips GROUP BY pickup_borough, pickup_zone), ranked AS (SELECT pickup_borough, pickup_zone, trip_count, row_number() OVER (PARTITION BY pickup_borough ORDER BY trip_count DESC) AS rn FROM zone_counts) SELECT pickup_borough, pickup_zone, trip_count FROM ranked WHERE rn = 1 ORDER BY pickup_borough",
   raw: "WITH zc AS (SELECT z.Borough AS b, z.Zone AS zone, count(*) AS n FROM yellow_tripdata y JOIN taxi_zone_lookup z ON y.PULocationID = z.LocationID GROUP BY 1, 2), ranked AS (SELECT b, zone, n, row_number() OVER (PARTITION BY b ORDER BY n DESC) AS rn FROM zc) SELECT b, zone, n FROM ranked WHERE rn = 1 ORDER BY b"}
- {id: b014, d: 3, cat: daily, author: claude-fresh-context, written_blind: true,
   q: "On average, how many trips started per day on weekend days (Saturday or Sunday) in 2023?",
   gold: "WITH daily AS (SELECT pickup_date, is_weekend, count(*) AS trips FROM fct_trips GROUP BY pickup_date, is_weekend) SELECT round(avg(trips), 1) AS avg_weekend_trips_per_day FROM daily WHERE is_weekend",
   raw: "WITH daily AS (SELECT CAST(tpep_pickup_datetime AS DATE) AS d, dayofweek(tpep_pickup_datetime) IN (0, 6) AS wk, count(*) AS trips FROM yellow_tripdata GROUP BY 1, 2) SELECT round(avg(trips), 1) FROM daily WHERE wk"}
- {id: b015, d: 3, cat: percentile, author: claude-fresh-context, written_blind: true,
   q: "What was the 90th percentile of trip_duration_minutes across all 2023 trips?",
   gold: "SELECT round(quantile_cont(trip_duration_minutes, 0.9), 1) AS p90_duration_minutes FROM fct_trips",
   raw: "SELECT round(quantile_cont(extract(epoch FROM (tpep_dropoff_datetime - tpep_pickup_datetime)) / 60, 0.9), 1) FROM yellow_tripdata"}
