- {id: q096, d: 2, cat: ranking, q: "Which pickup zone had the longest average trip distance in 2023, among zones with at least 10,000 pickups? Give the zone name.",
   gold: "SELECT pickup_zone FROM fct_trips GROUP BY 1 HAVING count(*) >= 10000 ORDER BY avg(trip_distance_miles) DESC LIMIT 1",
   raw: "SELECT z.Zone FROM yellow_tripdata y JOIN taxi_zone_lookup z ON y.PULocationID = z.LocationID GROUP BY 1 HAVING count(*) >= 10000 ORDER BY avg(y.trip_distance) DESC LIMIT 1"}
- {id: q097, d: 2, cat: time, q: "How many trips were picked up in the summer months of 2023 (June, July and August)?",
   gold: "SELECT count(*) FROM fct_trips WHERE month_key IN ('2023-06','2023-07','2023-08')",
   raw: "SELECT count(*) FROM yellow_tripdata WHERE tpep_pickup_datetime >= '2023-06-01' AND tpep_pickup_datetime < '2023-09-01'",
   sem: {metrics: [trip_count], where: ["{{ Dimension('trip__month_key') }} IN ('2023-06','2023-07','2023-08')"]}}
- {id: q098, d: 2, cat: average, q: "What was the average trip duration in 2023 for trips picked up between 5 pm and 6 pm (pickup hour 17), in minutes?",
   gold: "SELECT avg(trip_duration_minutes) FROM fct_trips WHERE pickup_hour = 17",
   raw: "SELECT avg(date_diff('second', tpep_pickup_datetime, tpep_dropoff_datetime) / 60.0) FROM yellow_tripdata WHERE hour(tpep_pickup_datetime) = 17",
   sem: {metrics: [avg_trip_duration], where: ["{{ Dimension('trip__pickup_hour') }} = 17"]}}
- {id: q099, d: 2, cat: ranking, q: "Which payment type was used for the most trips in 2023?",
   gold: "SELECT payment_type FROM fct_trips GROUP BY 1 ORDER BY count(*) DESC LIMIT 1",
   raw: "SELECT payment_type FROM yellow_tripdata GROUP BY 1 ORDER BY count(*) DESC LIMIT 1",
   sem: {metrics: [trip_count], group_by: [trip__payment_type], order_by: ["-trip_count"], limit: 1},
   also_accept: ["1"]}
- {id: q100, d: 2, cat: ranking, ordered: true, q: "Which 3 pickup zones had the highest total tips in 2023? Give the zone names, highest first.",
   gold: "SELECT pickup_zone FROM fct_trips GROUP BY 1 ORDER BY sum(tip_amount) DESC LIMIT 3",
   raw: "SELECT z.Zone FROM yellow_tripdata y JOIN taxi_zone_lookup z ON y.PULocationID = z.LocationID GROUP BY 1 ORDER BY sum(y.tip_amount) DESC LIMIT 3",
   sem: {metrics: [total_tips], group_by: [trip__pickup_zone], order_by: ["-total_tips"], limit: 3}}
- {id: q101, d: 2, cat: revenue, q: "How much revenue in 2023 came from trips paid in cash, in dollars?",
   gold: "SELECT sum(total_amount) FROM fct_trips WHERE payment_type = 'Cash'",
   raw: "SELECT sum(total_amount) FROM yellow_tripdata WHERE payment_type = 2",
   sem: {metrics: [total_revenue], where: ["{{ Dimension('trip__payment_type') }} = 'Cash'"]}}
- {id: q102, d: 2, cat: count, q: "How many trips in 2023 started and ended in the same taxi zone?",
   gold: "SELECT count(*) FROM fct_trips WHERE pickup_zone_id = dropoff_zone_id",
   raw: "SELECT count(*) FROM yellow_tripdata WHERE PULocationID = DOLocationID",
   sem: {metrics: [trip_count], where: ["{{ Dimension('trip__pickup_zone_id') }} = {{ Dimension('trip__dropoff_zone_id') }}"]}}
- {id: q103, d: 2, cat: average, q: "What was the average fare in 2023 for trips with the 'Standard rate' rate code, in dollars?",
   gold: "SELECT avg(fare_amount) FROM fct_trips WHERE rate_code = 'Standard rate'",
   raw: "SELECT avg(fare_amount) FROM yellow_tripdata WHERE RatecodeID = 1",
   sem: {metrics: [avg_fare], where: ["{{ Dimension('trip__rate_code') }} = 'Standard rate'"]}}
- {id: q104, d: 2, cat: time, q: "How many trips were picked up in the week of Christmas, from 25 December to 31 December 2023 inclusive?",
   gold: "SELECT count(*) FROM fct_trips WHERE pickup_date BETWEEN DATE '2023-12-25' AND DATE '2023-12-31'",
   raw: "SELECT count(*) FROM yellow_tripdata WHERE CAST(tpep_pickup_datetime AS DATE) BETWEEN DATE '2023-12-25' AND DATE '2023-12-31'",
   sem: {metrics: [trip_count], start_time: "2023-12-25", end_time: "2023-12-31"}}
- {id: q105, d: 2, cat: ranking, q: "Which pickup zone had the highest average fare in 2023, among zones with at least 50,000 pickups? Give the zone name.",
   gold: "SELECT pickup_zone FROM fct_trips GROUP BY 1 HAVING count(*) >= 50000 ORDER BY avg(fare_amount) DESC LIMIT 1",
   raw: "SELECT z.Zone FROM yellow_tripdata y JOIN taxi_zone_lookup z ON y.PULocationID = z.LocationID GROUP BY 1 HAVING count(*) >= 50000 ORDER BY avg(y.fare_amount) DESC LIMIT 1"}
