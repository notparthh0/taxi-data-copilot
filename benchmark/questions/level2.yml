# Level 2: grouping, rankings (top-N), several filters together, simple ratios.
# ordered: true  -> row order is part of the answer
# skip: [col]    -> a label column that is not compared (labels can be written many ways);
#                   the question then fixes the row order so the values can be compared
# also_accept    -> other ways of writing the same single answer
# percent: true  -> the answer is a percentage; the same value as a 0-1 fraction is also accepted
- {id: q051, d: 2, cat: ranking, q: "Which taxi zone had the most pickups in 2023? Give the zone name.",
   gold: "SELECT pickup_zone FROM fct_trips GROUP BY 1 ORDER BY count(*) DESC LIMIT 1",
   raw: "SELECT z.Zone FROM yellow_tripdata y JOIN taxi_zone_lookup z ON y.PULocationID = z.LocationID GROUP BY 1 ORDER BY count(*) DESC LIMIT 1",
   sem: {metrics: [trip_count], group_by: [trip__pickup_zone], order_by: ["-trip_count"], limit: 1}}
