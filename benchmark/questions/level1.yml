# Level 1: one table, one number, at most one or two simple filters.
# gold = hand-written SQL on the cleaned tables (its result is the gold answer)
# raw  = the obvious SQL on the raw table (its result is the "naive raw answer")
# sem  = the same question as a semantic-layer request, when the layer can express it
- {id: q001, d: 1, cat: count, q: "How many taxi trips were there in 2023?",
   gold: "SELECT count(*) FROM fct_trips",
   raw: "SELECT count(*) FROM yellow_tripdata",
   sem: {metrics: [trip_count]}}
- {id: q002, d: 1, cat: revenue, q: "What was the total revenue (total amount charged to passengers) in 2023, in dollars?",
   gold: "SELECT sum(total_amount) FROM fct_trips",
   raw: "SELECT sum(total_amount) FROM yellow_tripdata",
   sem: {metrics: [total_revenue]}}
